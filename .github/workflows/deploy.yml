name: Deploy to Tencent Cloud Static Website

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Build project
      run: npm run build
      
    - name: Deploy to Tencent Cloud
      uses: tencentyun/website-action@v1
      with:
        secret_id: ${{ secrets.TENCENT_SECRET_ID }}
        secret_key: ${{ secrets.TENCENT_SECRET_KEY }}
        bucket: professional-prompt-generator  # 请替换为您的实际存储桶名称
        region: ap-guangzhou                   # 请替换为您的实际区域
        source: ./dist
        target: /
        
    - name: Deploy status
      run: echo "🎉 腾讯云部署完成！网站已更新"